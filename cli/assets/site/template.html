<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="generator" content="strata">
  <meta name="record-id" content="$id$">
  <meta name="record-kind" content="$kind$">
  <meta name="record-status" content="$status$">
  <title>$if(title)$$title$ - $endif$Strata</title>
$for(css)$
  <link rel="stylesheet" href="$css$">
$endfor$
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('strata-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">Strata</a>
    <button id="theme-toggle" type="button" aria-label="Toggle color theme">
      Toggle theme
    </button>
  </header>
  <main>
    <article>
      <header class="record-header">
        <p class="record-id">$id$</p>
        <h1>$title$</h1>
        <p class="record-summary">
          <span class="record-kind">$kind$</span>
          <span class="record-status">$status$</span>
          <span>revision $revision$</span>
        </p>
      </header>
      $if(publication_relationships)$
      <section class="relationships" aria-labelledby="relationships-heading">
        <h2 id="relationships-heading">Relationships</h2>
        <ul class="relationship-list">
$for(publication_relationships)$
          <li>
            <span class="relationship-kind">$publication_relationships.relation$</span>:
            <a href="$publication_relationships.target_href$">$publication_relationships.target_title$</a>
          </li>
$endfor$
        </ul>
      </section>
      $endif$
      $body$
    </article>
  </main>
  <footer class="site-footer">
    <p>Published by Strata.</p>
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var button = document.getElementById('theme-toggle');
      if (!button) return;
      function currentTheme() {
        var explicit = root.getAttribute('data-theme');
        if (explicit) return explicit;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      button.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try {
          localStorage.setItem('strata-theme', next);
        } catch (error) {}
      });
    })();
  </script>
</body>
</html>
