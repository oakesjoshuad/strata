<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="strata">
  <meta name="record-id" content="$id$">
  <meta name="record-kind" content="$kind$">
  <meta name="record-status" content="$status$">
  <title>$if(title)$$title$ - $endif$Strata</title>
$for(css)$
  <link rel="stylesheet" href="$css$">
$endfor$
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">Strata</a>
    <button id="theme-toggle" type="button" aria-label="Toggle color theme">
      Toggle theme
    </button>
  </header>
  <main>
    <article>
      <header class="record-header">
        <p class="record-id">$id$</p>
        <h1>$title$</h1>
        <p class="record-summary">
          <span class="record-kind">$kind$</span>
          <span class="record-status">$status$</span>
          <span>revision $revision$</span>
        </p>
      </header>
      $body$
    </article>
  </main>
  <footer class="site-footer">
    <p>Published by Strata.</p>
  </footer>
  <script>
    (function () {
      var button = document.getElementById('theme-toggle');
      var root = document.documentElement;
      var saved = localStorage.getItem('strata-theme');
      if (saved) root.setAttribute('data-theme', saved);
      button.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('strata-theme', next);
      });
    }());
  </script>
</body>
</html>
